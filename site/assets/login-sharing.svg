<svg xmlns="http://www.w3.org/2000/svg" width="640" height="615" viewBox="0 0 640 615" role="img" aria-labelledby="title desc"><title id="title">タブとログインの関係</title><desc id="desc">通常ブラウザの2つのタブは同じログインを共有します。専用アカウントAとBは保存場所を分けます。</desc><style>text{font-family:system-ui,'Noto Sans JP',sans-serif;fill:#243247;font-size:20px}.head{font-size:25px;font-weight:700}.small{font-size:17px}.white{fill:white}</style><rect width="640" height="615" rx="24" fill="#f6f8fc"/><text x="28" y="42" class="head">通常ブラウザ：同じログインを共有</text><rect x="28" y="65" width="280" height="62" rx="14" fill="#fff" stroke="#d5dce7" stroke-width="2"/><text x="55" y="104" class="">タブ1 ／ Aサイト</text><rect x="332" y="65" width="280" height="62" rx="14" fill="#fff" stroke="#d5dce7" stroke-width="2"/><text x="359" y="104" class="">タブ2 ／ Aサイト</text><path d="M168 127v27h304v-27M320 154v25" fill="none" stroke="#64748b" stroke-width="3"/><rect x="100" y="183" width="440" height="65" rx="14" fill="#e8edf5" stroke="#d5dce7" stroke-width="2"/><text x="151" y="224" class="">共通の保存場所：利用者 A</text><text x="55" y="280" class="small">片方でログアウトすると、もう片方にも反映</text><text x="28" y="338" class="head">専用アカウント：保存場所を分ける</text><rect x="28" y="362" width="280" height="62" rx="14" fill="#fff" stroke="#d5dce7" stroke-width="2"/><text x="51" y="402" class="">タブ1 ／ 個人用 A</text><rect x="332" y="362" width="280" height="62" rx="14" fill="#fff" stroke="#d5dce7" stroke-width="2"/><text x="355" y="402" class="">タブ2 ／ 仕事用 B</text><path d="M168 427v25m-7-7 7 7 7-7" fill="none" stroke="#64748b" stroke-width="3"/><path d="M472 427v25m-7-7 7 7 7-7" fill="none" stroke="#64748b" stroke-width="3"/><rect x="28" y="463" width="280" height="85" rx="14" fill="#e5efff" stroke="#5382cc" stroke-width="2"/><text x="57" y="496" class="">専用の保存場所 A</text><text x="57" y="527" class="small">利用者 A でログイン</text><rect x="332" y="463" width="280" height="85" rx="14" fill="#e2f5ed" stroke="#389b79" stroke-width="2"/><text x="360" y="496" class="">専用の保存場所 B</text><text x="360" y="527" class="small">利用者 B でログイン</text><text x="53" y="589" class="small">別タブを作るだけでは、ログインは分かれません。</text></svg>
