<svg xmlns="http://www.w3.org/2000/svg" width="640" height="810" viewBox="0 0 640 810" role="img" aria-labelledby="title desc"><title id="title">専用アカウントの追加と切り替え</title><desc id="desc">メニューで追加、専用側のサイトでログイン、登録確定の順です。次からはアカウントを選びサイト上の利用者を確認します。</desc><style>text{font-family:system-ui,'Noto Sans JP',sans-serif;fill:#243247;font-size:20px}.head{font-size:25px;font-weight:700}.small{font-size:17px}.white{fill:white}</style><rect width="640" height="810" rx="24" fill="#f6f8fc"/><text x="28" y="43" class="head">はじめて追加するとき</text><rect x="25" y="66" width="590" height="104" rx="14" fill="#fff" stroke="#d5dce7" stroke-width="2"/><circle cx="59" cy="102" r="21" fill="#aa5600"/><text x="53" y="109" class="white">1</text><text x="95" y="108" class="">操作メニューから追加</text><text x="44" y="145" class="small">アカウントを切り替える → 別のアカウントでログイン</text><path d="M320 174v25m-7-7 7 7 7-7" fill="none" stroke="#64748b" stroke-width="3"/><rect x="25" y="205" width="590" height="104" rx="14" fill="#fff" stroke="#d5dce7" stroke-width="2"/><circle cx="59" cy="241" r="21" fill="#aa5600"/><text x="53" y="248" class="white">2</text><text x="95" y="247" class="">開いたサイトでログイン</text><text x="44" y="284" class="small">ID・パスワードや追加認証は、サイトの画面で操作</text><path d="M320 313v25m-7-7 7 7 7-7" fill="none" stroke="#64748b" stroke-width="3"/><rect x="25" y="344" width="590" height="104" rx="14" fill="#fff" stroke="#d5dce7" stroke-width="2"/><circle cx="59" cy="380" r="21" fill="#aa5600"/><text x="53" y="387" class="white">3</text><text x="95" y="386" class="">ログインできたら登録を確定</text><text x="44" y="423" class="small">操作メニュー → このログインを登録</text><text x="28" y="504" class="head">次から切り替えるとき</text><rect x="25" y="529" width="590" height="124" rx="14" fill="#e5efff" stroke="#5382cc" stroke-width="2"/><text x="45" y="569" class="">操作メニュー → アカウントを切り替える</text><text x="45" y="606" class="">使いたい名前を選択</text><text x="45" y="634" class="small">今見ているサイトの候補が最初に表示されます</text><path d="M320 660v25m-7-7 7 7 7-7" fill="none" stroke="#64748b" stroke-width="3"/><rect x="25" y="698" width="590" height="86" rx="14" fill="#fff3de" stroke="#d4a54b" stroke-width="2"/><text x="45" y="732" class="">送信前に、サイト内の利用者名を確認</text><text x="45" y="762" class="small">アプリの名前・色は目印です。本人の自動判定ではありません。</text></svg>
