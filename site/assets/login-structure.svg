<svg xmlns="http://www.w3.org/2000/svg" width="640" height="737" viewBox="0 0 640 737" role="img" aria-labelledby="title desc"><title id="title">サイト設定の中身</title><desc id="desc">一つのサイト設定に共通の検索と自動入力、複数の専用アカウント、認証で開くIDパスワード保存欄があります。</desc><style>text{font-family:system-ui,'Noto Sans JP',sans-serif;fill:#243247;font-size:20px}.head{font-size:25px;font-weight:700}.small{font-size:17px}.white{fill:white}</style><rect width="640" height="737" rx="24" fill="#f6f8fc"/><rect x="22" y="22" width="596" height="608" rx="14" fill="#fffaf4" stroke="#e7b679" stroke-width="2"/><text x="49" y="65" class="head">サイト設定：Aサイト・個人用</text><rect x="45" y="91" width="550" height="78" rx="14" fill="#fff" stroke="#d5dce7" stroke-width="2"/><text x="67" y="124" class="">開始URL・検索ボタン・基本の自動入力</text><text x="67" y="153" class="small">↓ この中のアカウントで共通使用</text><rect x="45" y="192" width="550" height="189" rx="14" fill="#f6f8fc" stroke="#d5dce7" stroke-width="2"/><text x="64" y="226" class="">ログインを分けて保存</text><rect x="62" y="244" width="249" height="108" rx="14" fill="#e5efff" stroke="#5382cc" stroke-width="2"/><text x="82" y="281" class="">アカウント 1</text><text x="82" y="313" class="head">個人用 A</text><rect x="328" y="244" width="249" height="108" rx="14" fill="#e2f5ed" stroke="#389b79" stroke-width="2"/><text x="348" y="281" class="">アカウント 2</text><text x="348" y="313" class="head">仕事用 B</text><rect x="45" y="404" width="550" height="195" rx="14" fill="#f1ecfa" stroke="#a391bf" stroke-width="2"/><rect x="70" y="450" width="30" height="25" rx="4" fill="#73608d"/><path d="M76 450v-8a9 9 0 0 1 18 0v8" fill="none" stroke="#73608d" stroke-width="4"/><text x="119" y="447" class="head">保存ID・パスワード</text><text x="119" y="480" class="small">Face IDなどの端末認証で開く</text><text x="66" y="528" class="">必要なときに確認・コピー</text><text x="66" y="564" class="small">※ 保存だけではログインしません</text><text x="32" y="674" class="">入力情報を使い分けたい場合は、</text><text x="32" y="707" class="small">同じAサイトでも別の「サイト設定」を作ります。</text></svg>
